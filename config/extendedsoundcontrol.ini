; Extended Sound Control settings. Changes made in the game (its own menu, "." by default, or the Sims4VR debug menu,
; or the console) go to extendedsoundcontrol_user.ini, which wins over this file.
[sound]
; Master boost: 1 = the game's own loudness, up to 4 (400 %). Goes through the game's own limiter.
boost = 1
; 1 = once a lot has loaded, write how the game's sound mixer is built to extendedsoundcontrol_probe.txt.
probe_on_load = 0
; Per category, on top of the master boost (1 .. 4).
music_boost = 1
effects_boost = 1
voices_boost = 1
ui_boost = 1
menu_music_boost = 1
; Ambient (0.5.0): the game has no ambient slider. ambient_bus = which of the 4 buses without a slider
; is ambience (1 .. 4; changing it in the game mutes that bus for 4 s so you can hear it), ambient_boost 1 .. 4.
ambient_bus=1
ambient_boost=1
; Clarity (0.4.0): 1 = keep the game's muffling of ordinary sounds at or above clarity_floor Hz
; (phone/TV/radio speaker effects stay) and open its treble cuts. 0 = the game's own sound.
clarity=1
clarity_floor=3000
; Menu hotkey without Sims4VR: a Windows virtual-key code (190 = ".", 0 = none).
menu_key=190
